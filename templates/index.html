<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Information Form</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <!-- LOGO -->

        <div class="form-logo">
            <img
                src="{{ url_for('static', filename='1788601861588.png') }}"
                alt="Logo">
        </div>


        <!-- HEADER -->

        <h1>
            JA1 Manaoag Members Information Form
        </h1>

        <p class="subtitle">
            Please provide your information below.
        </p>


        <!-- FORM -->

        <form action="/submit" method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your complete address"
                    required>

            </div>


            <!-- CONTACT -->

            <div class="form-group">

                <label for="contact">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="contact"
                    name="contact"
                    placeholder="Enter your contact number"
                    required>

            </div>


            <!-- SEX -->

            <div class="form-group">

                <label>
                    Sex
                </label>

                <div class="radio-group">


                    <div class="radio-option">

                        <input
                            type="radio"
                            id="male"
                            name="sex"
                            value="Male"
                            required>

                        <label for="male">
                            Male
                        </label>

                    </div>


                    <div class="radio-option">

                        <input
                            type="radio"
                            id="female"
                            name="sex"
                            value="Female">

                        <label for="female">
                            Female
                        </label>

                    </div>


                </div>

            </div>


            <!-- CIVIL STATUS -->

            <div class="form-group">

                <label for="civil_status">
                    Civil Status
                </label>

                <select
                    id="civil_status"
                    name="civil_status"
                    required>

                    <option
                        value=""
                        disabled
                        selected>
                        Select civil status
                    </option>

                    <option value="Single">
                        Single
                    </option>

                    <option value="Married">
                        Married
                    </option>

                    <option value="Widowed">
                        Widowed
                    </option>

                    <option value="Separated">
                        Separated
                    </option>

                </select>

            </div>


            <!-- EDUCATIONAL ATTAINMENT -->

            <div class="form-group">

                <label for="educational_attainment">
                    Educational Attainment
                </label>

                <select
                    id="educational_attainment"
                    name="educational_attainment"
                    required>

                    <option
                        value=""
                        disabled
                        selected>
                        Select educational attainment
                    </option>

                    <option value="Elementary">
                        Elementary
                    </option>

                    <option value="Junior High School">
                        Junior High School
                    </option>

                    <option value="Senior High School">
                        Senior High School
                    </option>

                    <option value="College">
                        College
                    </option>

                    <option value="Vocational">
                        Vocational
                    </option>

                    <option value="Postgraduate">
                        Postgraduate
                    </option>

                </select>

            </div>


            <!-- FATHER'S NAME -->

            <div class="form-group">

                <label for="father_name">
                    Father's Name
                </label>

                <input
                    type="text"
                    id="father_name"
                    name="father_name"
                    placeholder="Enter father's name"
                    required>

            </div>


            <!-- MOTHER'S NAME -->

            <div class="form-group">

                <label for="mother_name">
                    Mother's Name
                </label>

                <input
                    type="text"
                    id="mother_name"
                    name="mother_name"
                    placeholder="Enter mother's name"
                    required>

            </div>


            <!-- EMPLOYMENT STATUS -->

            <div class="form-group">

                <label for="employment_status">
                    Employment Status
                </label>

                <select
                    id="employment_status"
                    name="employment_status"
                    required>

                    <option
                        value=""
                        disabled
                        selected>
                        Select employment status
                    </option>

                    <option value="Employed">
                        Employed
                    </option>

                    <option value="Self-Employed">
                        Self-Employed
                    </option>

                    <option value="Unemployed">
                        Unemployed
                    </option>

                    <option value="Student">
                        Student
                    </option>

                    <option value="Retired">
                        Retired
                    </option>

                </select>

            </div>


            <!-- SUBMIT -->

            <div class="form-group">

                <button type="submit">
                    Submit Information
                </button>

            </div>


        </form>

    </div>

</body>

</html>
