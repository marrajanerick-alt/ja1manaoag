<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


<div class="page">

    <div class="container">


        <!-- ========================= -->
        <!-- LOGO -->
        <!-- ========================= -->

        <div class="form-logo">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Logo">

        </div>


        <!-- ========================= -->
        <!-- TITLE -->
        <!-- ========================= -->

        <h1>
            Personal Information
        </h1>

        <p class="subtitle">
            Please provide your information below.
        </p>


        <!-- ========================= -->
        <!-- FORM -->
        <!-- ========================= -->

        <form
            action="{{ url_for('submit') }}"
            method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <!-- NICKNAME -->

            <div class="form-group">

                <label for="nickname">

                    Nickname

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    placeholder="Enter your nickname">

            </div>


            <!-- AGE -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                    step="1"
                    inputmode="numeric"
                    required>

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="date_of_birth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"
                    required>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your complete address"
                    autocomplete="street-address"
                    required>

            </div>


            <!-- CONTACT NUMBER -->

            <div class="form-group">

                <label for="contact">
                    Contact Number
                </label>


                <div class="phone-input">


                    <div class="phone-prefix">

                        <span class="flag">
                            🇵🇭
                        </span>

                        <span class="code">
                            +63
                        </span>

                    </div>


                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="9XX XXX XXXX"
                        maxlength="10"
                        pattern="9[0-9]{9}"
                        inputmode="numeric"
                        autocomplete="tel"
                        required>


                </div>


                <small class="input-hint">
                    Enter 10 digits starting with 9.
                </small>

            </div>


            <!-- SEX -->

            <div class="form-group">

                <label>
                    Sex
                </label>


                <div class="radio-group">


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="sex"
                            value="Male"
                            required>

                        <span>
                            Male
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="sex"
                            value="Female">

                        <span>
                            Female
                        </span>

                    </label>


                </div>

            </div>


            <!-- CIVIL STATUS -->

            <div class="form-group">

                <label for="civil_status">
                    Civil Status
                </label>


                <select
                    id="civil_status"
                    name="civil_status"
                    required>


                    <option
                        value=""
                        disabled
                        selected>

                        Select civil status

                    </option>


                    <option value="Single">
                        Single
                    </option>


                    <option value="Married">
                        Married
                    </option>


                    <option value="Widowed">
                        Widowed
                    </option>


                    <option value="Separated">
                        Separated
                    </option>


                </select>

            </div>


            <!-- EDUCATIONAL ATTAINMENT -->

            <div class="form-group">

                <label for="educational_attainment">
                    Educational Attainment
                </label>


                <select
                    id="educational_attainment"
                    name="educational_attainment"
                    required>


                    <option
                        value=""
                        disabled
                        selected>

                        Select educational attainment

                    </option>


                    <option value="Elementary">
                        Elementary
                    </option>


                    <option value="Junior High School">
                        Junior High School
                    </option>


                    <option value="Senior High School">
                        Senior High School
                    </option>


                    <option value="College">
                        College
                    </option>


                    <option value="Vocational">
                        Vocational
                    </option>


                    <option value="Postgraduate">
                        Postgraduate
                    </option>


                </select>

            </div>


            <!-- FATHER'S NAME -->

            <div class="form-group">

                <label for="father_name">
                    Father's Name
                </label>


                <input
                    type="text"
                    id="father_name"
                    name="father_name"
                    placeholder="Enter father's name"
                    required>

            </div>


            <!-- MOTHER'S NAME -->

            <div class="form-group">

                <label for="mother_name">
                    Mother's Name
                </label>


                <input
                    type="text"
                    id="mother_name"
                    name="mother_name"
                    placeholder="Enter mother's name"
                    required>

            </div>


            <!-- EMPLOYMENT STATUS -->

            <div class="form-group">

                <label for="employment_status">
                    Employment Status
                </label>


                <select
                    id="employment_status"
                    name="employment_status"
                    required>


                    <option
                        value=""
                        disabled
                        selected>

                        Select employment status

                    </option>


                    <option value="Employed">
                        Employed
                    </option>


                    <option value="Self-Employed">
                        Self-Employed
                    </option>


                    <option value="Unemployed">
                        Unemployed
                    </option>


                    <option value="Student">
                        Student
                    </option>


                    <option value="Retired">
                        Retired
                    </option>


                </select>

            </div>


            <!-- ========================= -->
            <!-- CHRISTIAN INFORMATION -->
            <!-- ========================= -->


            <!-- BAPTIZED -->

            <div class="form-group">

                <label>
                    Are you already baptized as a Christian?
                </label>


                <div class="radio-group">


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="baptized"
                            value="Yes"
                            required>

                        <span>
                            Yes
                        </span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="baptized"
                            value="No">

                        <span>
                            No
                        </span>

                    </label>


                </div>

            </div>


            <!-- CHRISTIAN DURATION -->

            <div class="form-group">

                <label for="christian_duration">
                    How long have you been a Christian?
                </label>


                <select
                    id="christian_duration"
                    name="christian_duration"
                    required>


                    <option
                        value=""
                        disabled
                        selected>

                        Select duration

                    </option>


                    <option value="New">
                        New
                    </option>


                    <option value="1-6 months">
                        1-6 months
                    </option>


                    <option value="6-11 months">
                        6-11 months
                    </option>


                    <option value="1-2 years">
                        1-2 years
                    </option>


                    <option value="3-4 years">
                        3-4 years
                    </option>


                    <option value="5 years and above">
                        5 years and above
                    </option>


                </select>

            </div>


            <!-- SKILLS -->

            <div class="form-group">

                <label for="skills">

                    Skills

                    <span class="optional">
                        (Optional)
                    </span>

                </label>


                <input
                    type="text"
                    id="skills"
                    name="skills"
                    placeholder="ex. singing, dancing, playing instruments">

            </div>


            <!-- ========================= -->
            <!-- SUBMIT -->
            <!-- ========================= -->

            <button
                type="submit"
                class="submit-button">

                Submit Information

            </button>


        </form>


    </div>

</div>


</body>

</html>
