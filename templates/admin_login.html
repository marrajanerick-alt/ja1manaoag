<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(255,255,255,0.88),
                    rgba(255,255,255,0.88)
                ),
                url("/static/14fbb570668080d5d5952ab7b710bcf7 (1).jpg");

            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;

            padding: 35px 30px;

            background: rgba(255,255,255,0.95);

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);
        }

        h1 {
            margin: 0;

            text-align: center;

            color: #8f2948;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin: 8px 0 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #444;
        }

        input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #b83b5e;
        }

        button {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 10px;

            background: #b83b5e;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #8f2948;
        }

        .error {
            margin-bottom: 18px;

            padding: 10px;

            border-radius: 8px;

            background: #fce8ed;

            color: #8f2948;

            font-size: 13px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Enter your administrator credentials.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
