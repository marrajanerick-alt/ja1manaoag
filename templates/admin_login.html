<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='admin_login.css') }}">

</head>


<body>


    <main class="login-page">


        <div class="login-card">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="{{ url_for('static', filename='1788601861588.png') }}"
                    alt="Manaoag Logo"
                    class="logo">

            </div>


            <!-- TITLE -->

            <h1>
                Admin Login
            </h1>

            <p class="subtitle">
                Sign in to access the administration dashboard.
            </p>


            <!-- ERROR -->

            {% if error %}

            <div class="error-message">

                <span class="error-icon">!</span>

                <span>
                    {{ error }}
                </span>

            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="/admin">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2">

                                <path
                                    d="M20 21a8 8 0 0 0-16 0">

                                </path>

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4">

                                </circle>

                            </svg>
                        </span>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2">

                                <rect
                                    x="3"
                                    y="11"
                                    width="18"
                                    height="10"
                                    rx="2">

                                </rect>

                                <path
                                    d="M7 11V7a5 5 0 0 1 10 0v4">

                                </path>

                            </svg>

                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>


                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password">

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2">

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z">

                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3">

                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    <span>
                        Sign In
                    </span>

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <path
                            d="M5 12h14">

                        </path>

                        <path
                            d="m13 6 6 6-6 6">

                        </path>

                    </svg>

                </button>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <span>
                    Authorized personnel only
                </span>

            </div>


        </div>


    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.innerHTML = `
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.3 18.3 0 0 1-3.2 4.3"></path>
                    <path d="M6.1 6.1C3.4 8.1 2 12 2 12s3.5 8 10 8c1.6 0 3-.4 4.2-1"></path>
                `;

            } else {

                password.type = "password";

                icon.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;

            }

        }

    </script>


</body>

</html>
